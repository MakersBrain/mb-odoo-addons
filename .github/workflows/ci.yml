name: CI

# Eight jobs, ordered around the fast static gate. `static`
# needs no container and finishes in seconds, so a broken manifest never costs
# an eight-minute image pull. Selected Odoo jobs run in parallel behind it, and
# one stable aggregate job reports the required result.
#
# GitHub Actions is the assumption here, not a requirement: every lane is a
# handful of `odoo` invocations against a Postgres service, so the translation
# to GitLab CI or Forgejo is mechanical.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Bumping this is a deliberate act: the addons declare 19.0.x versions and use
  # Odoo 19 extension points. Pin the digest too once one is chosen.
  ODOO_IMAGE: odoo:19@sha256:94a4f480b8039dc9ca2bca9e77e59f97d3311f66e2aad663cf2670be9c66d4ea
  POSTGRES_IMAGE: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193

jobs:
  # Cheap gate so a documentation or tooling change does not spend runner time
  # on container lanes. The heavy jobs are skipped by `if:`
  # rather than filtered by `on.paths`, because a filtered workflow never
  # reports its check runs and a required status check would then block the
  # pull request forever. A skipped job still reports, and branch protection
  # counts it as satisfied.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      server: ${{ steps.filter.outputs.server }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
      frontend: ${{ steps.filter.outputs.frontend }}
      i18n: ${{ steps.filter.outputs.i18n }}
      lifecycle: ${{ steps.filter.outputs.lifecycle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            if git fetch --quiet origin "${{ github.base_ref }}" \
                 && git diff --name-only "$base"...HEAD > "$RUNNER_TEMP/changed-paths"; then
              :
            else
              echo FORCE_ALL > "$RUNNER_TEMP/changed-paths"
            fi
          else
            # Main pushes and manual dispatches are unconditionally full. The
            # classifier owns that invariant, so their diff is irrelevant.
            : > "$RUNNER_TEMP/changed-paths"
          fi
          printf 'changed paths:\n'
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/changed-paths"
          python3 tools/ci_changed_paths.py \
            --event "${{ github.event_name }}" --ref "${{ github.ref }}" \
            < "$RUNNER_TEMP/changed-paths" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  static:
    name: Static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22", cache: "npm", cache-dependency-path: "package-lock.json"}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Matches the odoo:19 runtime, and the `target-version`/`python_version`
          # that ruff and mypy are configured against in pyproject.toml.
          python-version: "3.12"

      # Pinned, not `@latest`. `ruff format --check` is a blocking gate, so a
      # newer ruff that reflows one expression differently would fail a branch
      # that is green on the contributor's machine. Bump in lockstep with the
      # RUFF_VERSION / MYPY_VERSION in the Makefile.
      - name: Install ruff and mypy
        run: |
          pipx install ruff==0.16.4
          pipx install mypy==2.3.1

      - name: Ruff
        run: ruff check --output-format=github addons tools scripts

      - name: Formatting and import order
        run: |
          ruff format --check addons tools scripts
          ruff check --select I --output-format=github addons tools scripts

      # tools/ is enforced. See the mypy block in pyproject.toml for why addons/
      # is advisory: `odoo` ships no stubs, so a green addons run would certify
      # hundreds of files that were never really checked.
      - name: Types (tools/, blocking)
        run: mypy tools

      - name: Types (addons/, advisory)
        continue-on-error: true
        run: mypy addons

      - name: Manifests, data paths, assets, XML, access rules, dependency graph
        run: python3 tools/check_addons.py

      - name: Static-policy negative canaries
        run: >-
          python3 -m unittest
          tools.test_check_addons
          tools.test_dependency_policy
          tools.test_ci_changed_paths
          tools.test_ci_release_admission
          tools.test_ci_required_gate

      - name: Concurrency suite inventory
        run: python3 tools/check_concurrency_inventory.py

      - name: Migration matrix, phases, and manifest versions
        run: python3 tools/check_migration_matrix.py

      - name: Addon dependency inventory and hash-checked lock
        run: |
          python3 tools/dependency_policy.py
          docker run --rm --entrypoint python3 \
            -v "$PWD:/src:ro" -w /src "$ODOO_IMAGE" \
            tools/dependency_policy.py --runtime

      # The published UI package carries a generated Odoo SCSS projection. The
      # workflow token reads the private package and CI verifies the addon's
      # checked-in copy byte-for-byte.
      - name: Authenticate to GitHub Packages
        run: npm config set --location=user //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - name: Odoo SCSS projection matches the UI package
        run: python3 tools/check_brand_scss.py

      # This repository is the provider of /mb_control/v1 and mb-control-plane is
      # its only client. Since they no longer share a repository, nothing else
      # notices a route being renamed, losing auth="public", or gaining a method.
      # The contract is generated from the source, so a drift here means the
      # bridge surface changed and the client has to be sequenced accordingly.
      - name: Bridge contract matches the routes it describes
        run: python3 tools/bridge_contract.py --check

      # Catalogue completeness and safety, plus the source scanner that catches
      # user-facing text extraction cannot see because it is not wrapped in
      # `_()` or `_t()`. Stricter than `msgfmt` on purpose: Odoo's exporter does
      # not emit the `#, python-format` flags gettext needs to validate
      # placeholders, so `%(product)s` disappearing in translation is a runtime
      # crash that only this checker catches.
      #
      # This lane does not prove the committed POT still matches the source —
      # that needs a database with the addons installed, so it lives in the
      # `i18n` lane below.
      - name: Install polib
        run: pip install polib

      - name: Translation catalogues and source marking
        run: python3 tools/check_i18n.py --all --summary

      # A second opinion on the catalogues, from an implementation that does
      # not share our parser's assumptions. This was `msgfmt --check-header
      # --check-format`, which meant installing gettext every run: 178s of a
      # 197s job while the repository was private, and once it went public the
      # apt-get hung outright -- two runs cancelled at 18 and 29 minutes. polib
      # is already here for the step above, so the independent check now costs
      # nothing and cannot hang.
      #
      # msgfmt's --check-format is not missed: Odoo's exporter omits the
      # `#, python-format` flags gettext needs, which is why check_i18n.py above
      # is the strict placeholder check and always was.
      - name: Catalogues parse and their headers are well formed
        run: python3 tools/check_po_parse.py

  upgrade:
    name: Predecessor upgrade twice
    runs-on: ubuntu-latest
    needs: [static, changes]
    if: needs.changes.outputs.upgrade == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}

      - name: Install pinned predecessor fixture and upgrade candidate twice
        run: DISPOSABLE_DB=mb_ci make upgrade-test

  uninstall:
    name: Uninstall safety
    runs-on: ubuntu-latest
    needs: [static, changes]
    if: needs.changes.outputs.lifecycle == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install and uninstall all repository addons
        run: DISPOSABLE_DB=mb_ci make uninstall-test

  i18n:
    name: Catalogue freshness
    runs-on: ubuntu-latest
    needs: [static, changes]
    if: needs.changes.outputs.i18n == 'true'
    services:
      db:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The committed POT files must equal what Odoo extracts from the current
      # source. The `static` lane proves the catalogues are complete and safe
      # against the committed POT; it cannot prove the POT itself is current,
      # because extraction needs a database with the addons installed and their
      # views and model metadata loaded.
      #
      # French is loaded before the addons are installed, which is also the
      # order a deployment uses: it makes the install path import each addon's
      # fr.po, so a catalogue that Odoo refuses fails here rather than in
      # production.
      #
      # Every addon in `addons/` is installed, not the shorter `MODULES` list
      # the other lanes use — a translation gate that skipped addons would be
      # a gate with holes in it.
      #
      # `--user root` because the exporter writes into the mounted workspace and
      # the image runs as uid 101. Nothing after this step writes to the tree.
      - name: Export every POT and assert no drift
        run: |
          mkdir -p oca
          mapfile -t ALL_MODULE_NAMES < <(
            find addons -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
          )
          ALL_MODULES=$(IFS=,; echo "${ALL_MODULE_NAMES[*]}")

          # Odoo 19 rewrote the `i18n` CLI. Its subcommands accept only
          # -c/-d/-l/-o and module names: the --db_host/--db_port/--db_user/
          # --db_password flags the server still takes are not options of
          # `odoo i18n export`, and connection details have to arrive in a
          # config file instead. The same file carries addons_path, so every
          # invocation below reduces to `-c` plus what it is actually doing.
          #
          # Written with echo rather than a heredoc because this is a YAML block
          # scalar: a heredoc body would carry the block's indentation into the
          # file, and a leading space turns an ini key into a continuation of
          # the line above it. It is written outside the checkout so it cannot
          # be mistaken for a source file or show up in the drift diff.
          conf_dir=$(mktemp -d)
          {
            echo "[options]"
            echo "addons_path = /mnt/mb-addons,/usr/lib/python3/dist-packages/odoo/addons"
            echo "db_host = localhost"
            echo "db_port = 5432"
            echo "db_user = odoo"
            echo "db_password = odoo"
            echo "data_dir = /tmp/odoo"
          } > "$conf_dir/odoo-ci.conf"

          # --entrypoint odoo bypasses the image's own entrypoint, which appends
          # a second --db_host/--db_port/--db_user/--db_password to whatever it
          # is given. The server tolerates the duplicates; `odoo i18n` rejects
          # them as unrecognized arguments and exits 2.
          #
          # --user root because the exporter writes into the mounted workspace
          # and the image runs as uid 101. Nothing after this step writes to the
          # tree.
          odoo_ci() {
            docker run --rm --network host --user root --entrypoint odoo \
              -v "$PWD/addons:/mnt/mb-addons" \
              -v "$conf_dir/odoo-ci.conf:/tmp/odoo-ci.conf:ro" \
              "$ODOO_IMAGE" "$@"
          }

          odoo_ci -c /tmp/odoo-ci.conf -d ci_i18n -i base \
                  --stop-after-init --without-demo --log-level=warn
          odoo_ci i18n loadlang -c /tmp/odoo-ci.conf -d ci_i18n -l fr_FR
          odoo_ci -c /tmp/odoo-ci.conf -d ci_i18n -i "$ALL_MODULES" \
                  --stop-after-init --without-demo --log-level=warn
          odoo_ci i18n export -c /tmp/odoo-ci.conf -d ci_i18n \
                  "${ALL_MODULE_NAMES[@]}" -l pot

          sudo chown -R "$(id -u):$(id -g)" addons
          # `add -N` so a POT added in this very commit is visible to `git diff`
          # rather than being silently skipped as untracked.
          #
          # `-I` because three headers move on every export without the source
          # having changed: both date stamps, and Project-Id-Version, which
          # carries the Odoo *image* build date rather than anything about this
          # repository. Bumping the pinned image would otherwise fail this gate
          # across every catalogue at once and say "stale" about files that are
          # perfectly current.
          git add -N -- 'addons/*/i18n/*.pot'
          git diff --exit-code \
            -I '^"(POT-Creation-Date|PO-Revision-Date|Project-Id-Version)' \
            -- 'addons/*/i18n/*.pot' \
            || { echo "::error::Committed POT files are stale. Re-export them."; exit 1; }

  server:
    name: Server tests
    runs-on: ubuntu-latest
    needs: [static, changes]
    if: needs.changes.outputs.server == 'true'
    services:
      db:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Every repository server test. `--test-tags` implies `--test-enable`,
      # which implies `--stop-after-init`. Odoo exits non-zero when a test
      # fails, so the result needs no log scraping.
      #
      # Browser-based Hoot tests are outside this server-test lane because the
      # Odoo runtime image does not contain a browser.
      #
      # The database must be new for this to mean anything: `-i` on a database
      # where the modules are already installed is a no-op, and at_install tests
      # then silently do not run — a green lane that tested nothing. Here the
      # Postgres service is created fresh per job, so `ci_test` cannot exist.
      # `make test` cannot rely on that and force-drops instead.
      #
      # Not covered, and not pretended otherwise: physical printer and scanner
      # qualification. The Phomemo M110 and NIIMBOT D110 packet builders are
      # tested against fixtures, and no device is attached to any runner.
      - name: Run the suite
        run: |
          set -o pipefail
          mkdir -p oca test-artifacts
          EXTENSION_ROOT=$(tools/ci_extension.sh)
          MODULES=$(find "$EXTENSION_ROOT/addons" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)
          TEST_TAGS=$(printf '%s' "$MODULES" | sed 's#^#/#; s#,#,/#g')
          docker run --rm --network host \
            -e HOST=localhost \
            -e PYTHONPATH=/opt/mb-extension/python \
            -v "$EXTENSION_ROOT:/opt/mb-extension:ro" \
            "$ODOO_IMAGE" \
            odoo --addons-path=/opt/mb-extension/addons,/usr/lib/python3/dist-packages/odoo/addons \
                 --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                 --data-dir=/tmp/odoo \
                 -d ci_test -i "$MODULES" \
                 --test-tags "$TEST_TAGS" --stop-after-init --log-level=test \
            2>&1 | tee test-artifacts/server.log

          test_count=$(grep -Eo '[0-9]+ tests' test-artifacts/server.log | tail -n 1 | cut -d' ' -f1)
          test -n "$test_count" && test "$test_count" -ge 703
          mapfile -t TEST_MODULES < <(
            find "$EXTENSION_ROOT/addons" -path '*/tests/test_*.py' -printf '%h\n' \
              | sed 's#/tests$##' | xargs -n1 basename | sort -u
          )
          test "${#TEST_MODULES[@]}" -gt 0
          for module in "${TEST_MODULES[@]}"; do
            grep -Eq "odoo.tests.stats: ${module}: [1-9][0-9]* tests" \
              test-artifacts/server.log
          done
          for class in \
            TestUrssafConcurrency TestFiringConcurrency TestBoardContentConcurrency \
            TestDepotContractConcurrency TestCommercialStockConcurrency \
            TestOperationReceiptConcurrency TestLabelTemplateConcurrency; do
            grep -q "$class" test-artifacts/server.log
          done

          docker run --rm -i --network host --entrypoint odoo \
            -e MB_SERVER_MODULES="$MODULES" \
            -e PYTHONPATH=/opt/mb-extension/python \
            -v "$EXTENSION_ROOT:/opt/mb-extension:ro" \
            "$ODOO_IMAGE" \
            shell --addons-path=/opt/mb-extension/addons,/usr/lib/python3/dist-packages/odoo/addons \
                  --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
                  --data-dir=/tmp/odoo -d ci_test --no-http --log-level=warn \
            < tools/server_install_assertions.py
          {
            echo "server_tests=$test_count"
            echo "repository_modules=$(printf '%s' "$MODULES" | tr ',' '\n' | wc -l)"
            echo "test_owning_modules=${#TEST_MODULES[@]}"
            echo "concurrency_tests=18"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload server failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-test-failure
          path: test-artifacts/server.log
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend assets and Hoot
    runs-on: ubuntu-latest
    needs: [static, changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare one clean frontend database
        run: |
          mkdir -p oca test-artifacts/hoot
          DISPOSABLE_DB=mb_ci make prepare-frontend-test

      - name: Compile every asset consumer
        run: |
          set -o pipefail
          DISPOSABLE_DB=mb_ci make assets-check 2>&1 | tee test-artifacts/assets.log

      - name: Run repository Hoot suites
        run: |
          set -o pipefail
          DISPOSABLE_DB=mb_ci HOOT_ARTIFACTS="$PWD/test-artifacts/hoot" \
            make browser-check 2>&1 | tee test-artifacts/browser.log

      - name: Upload frontend failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-failure
          path: |
            test-artifacts/assets.log
            test-artifacts/browser.log
            test-artifacts/hoot/
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required CI
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, static, server, upgrade, uninstall, frontend, i18n]
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      STATIC_RESULT: ${{ needs.static.result }}
      SERVER_SELECTED: ${{ needs.changes.outputs.server }}
      SERVER_RESULT: ${{ needs.server.result }}
      UPGRADE_SELECTED: ${{ needs.changes.outputs.upgrade }}
      UPGRADE_RESULT: ${{ needs.upgrade.result }}
      LIFECYCLE_SELECTED: ${{ needs.changes.outputs.lifecycle }}
      UNINSTALL_RESULT: ${{ needs.uninstall.result }}
      FRONTEND_SELECTED: ${{ needs.changes.outputs.frontend }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      I18N_SELECTED: ${{ needs.changes.outputs.i18n }}
      I18N_RESULT: ${{ needs.i18n.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require every selected lane
        run: python3 tools/ci_required_gate.py
