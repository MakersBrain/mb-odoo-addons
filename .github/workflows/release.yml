name: Odoo release

# Publishes one signed, digest-addressed Odoo runtime image and the release
# metadata that describes it. This repository does not compose a platform
# release and does not touch any environment: MakersBrain/mb-infra consumes this
# image by digest and owns staging qualification and production promotion.
#
# The base and OCA dependency are digest/commit pinned in deploy/Odoo.Dockerfile.
# The full CI suite must pass for this commit, images are signed with keyless
# cosign, and tools/release_metadata.py emits the machine-readable release record.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and describe without publishing or signing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: odoo-release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.OCI_REGISTRY }}
  REPOSITORY_PREFIX: ${{ vars.OCI_REPOSITORY_PREFIX }}
  IMAGE_NAME: mb-odoo

jobs:
  # Publication is gated on the same suite that guards main, but by *verifying*
  # the run that already happened for this commit rather than running it again.
  # Re-running cost a second full suite (~22 runner minutes) to re-prove what
  # main had already proven, and CI is a required status check on main, so a
  # commit cannot be there without it.
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: The CI suite passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | first | .conclusion // "none"')
          echo "CI conclusion for $GITHUB_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run for $GITHUB_SHA (found: $conclusion). Refusing to publish." >&2
            exit 1
          fi

  build:
    needs: verify-ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # keyless cosign signing
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Validate release inputs
        run: |
          set -eu
          test -n "$REGISTRY"
          test -n "$REPOSITORY_PREFIX"
          # The metadata generator refuses a tag, but fail early and loudly here
          # rather than after a ten-minute build.
          grep -q '^FROM odoo:[0-9]\+@sha256:[0-9a-f]\{64\}' deploy/Odoo.Dockerfile
          python3 tools/bridge_contract.py --check

      - name: Authenticate to the controlled registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        id: build
        run: |
          set -euo pipefail
          image="$REGISTRY/$REPOSITORY_PREFIX/$IMAGE_NAME"

          # A dry run loads the image into the local daemon instead of pushing,
          # so everything downstream except signing and publishing still runs
          # against a real image. Scanning a registry reference would be the
          # obvious thing to do and is exactly what makes a dry run useless: the
          # reference does not exist until something is pushed.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            output="type=docker"
          else
            output="type=image,push=true"
          fi

          docker buildx build \
            --platform linux/amd64 \
            --file deploy/Odoo.Dockerfile \
            --build-arg "SOURCE_COMMIT=$GITHUB_SHA" \
            --build-arg "SOURCE_REF=$GITHUB_REF_NAME" \
            --tag "$image:$GITHUB_SHA" \
            --metadata-file metadata.json \
            --output "$output" \
            .

          # Take the digest buildx reports rather than re-deriving it: it is the
          # digest that was actually pushed, and it stays correct if the build
          # ever becomes multi-platform.
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          test -n "$digest" && test "$digest" != "null"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        if: ${{ !inputs.dry_run }}
        run: cosign sign --yes '${{ steps.build.outputs.image }}'

      # Also runs on a dry run: this is the record mb-infra consumes, and a
      # release is the wrong moment to discover it cannot be generated.
      - name: Release metadata
        id: metadata
        run: |
          set -euo pipefail
          mkdir -p release
          python3 tools/release_metadata.py \
            --image '${{ steps.build.outputs.image }}' \
            --output release/release-metadata.json
          cp contracts/mb_control_v1.json release/
          cat release/release-metadata.json

          required=(release/release-metadata.json release/mb_control_v1.json)

          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::$file is missing or empty" >&2; exit 1; }
          done

          files="release/release-metadata.json:application/json release/mb_control_v1.json:application/json"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "will publish: $files"

      - name: Publish release metadata as an OCI artifact
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          artifact="$REGISTRY/$REPOSITORY_PREFIX/$IMAGE_NAME-release:${GITHUB_SHA}"
          # Deliberately unquoted: the list was validated in the step above.
          oras push "$artifact" \
            --artifact-type application/vnd.makersbrain.odoo-release.v1+json \
            ${{ steps.metadata.outputs.files }}
          # The metadata is not signed separately. Its digest is recorded here
          # and bound by mb-infra's composed release record.
          printf '%s@%s\n' "$artifact" "$(oras resolve "$artifact")" | tee release/artifact-reference.txt

      - name: Summary
        run: |
          {
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "### Odoo release rehearsal (dry run)"
              echo
              echo "Built, scanned and described. Nothing was signed or published."
            else
              echo "### Odoo release"
            fi
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image | \`${{ steps.build.outputs.image }}\` |"
            echo "| commit | \`$GITHUB_SHA\` |"
            if [ -f release/artifact-reference.txt ]; then
              echo "| metadata artifact | \`$(cat release/artifact-reference.txt)\` |"
            fi
            if [ -f release/release-metadata.json ]; then
              echo "| addons described | $(jq -r .addon_count release/release-metadata.json) |"
              echo "| bridge contract | $(jq -r '.bridge_contract.version' release/release-metadata.json), $(jq -r '.bridge_contract.endpoint_count' release/release-metadata.json) endpoints |"
            fi
            echo
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "Consume this digest from \`mb-infra\`. Do not deploy the tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odoo-release-${{ github.sha }}
          path: release/
          retention-days: 90
