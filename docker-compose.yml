name: mb-odoo

# A self-contained development stack: Postgres, Odoo, and the addons in this
# repository. It publishes no application data externally and contains only
# local development credentials. It is not a production deployment.

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mb-odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      # Odoo requires UTF-8 with a deterministic collation. A locale-aware
      # collation makes index order depend on the host's locale, and Odoo's
      # own comparisons then disagree with the database's.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Published so psql and the scripts in scripts/ can reach it from the
      # host. Drop this line in anything resembling a deployment.
      - "${DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  odoo:
    image: ${ODOO_IMAGE:-odoo:19}
    container_name: mb-odoo-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read by the image entrypoint. config/odoo.conf sets the same keys and
      # takes precedence; these are here so a bare `docker compose run odoo`
      # without the config file still finds the database.
      HOST: db
      PORT: 5432
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:-odoo}
      # Equivalent to --dev=reload: re-exec the server when a mounted .py file
      # changes. Without it, `make upgrade` runs as a separate process and
      # updates the database but not this worker's already-imported Python, so a
      # view referring to a field added in the same change parses against a model
      # that does not have it and the client dies with "field is undefined".
      # It does not cover XML: a view or data change still needs `make upgrade`.
      #
      # An env var rather than a line in odoo.conf because dev_mode is declared
      # file_exportable=False. Development only.
      ODOO_DEV: ${ODOO_DEV:-reload}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      # Mounted rather than copied into an image, so an edit is one restart away
      # rather than one rebuild away. This is a development stack; a deployment
      # would bake the addons in.
      - ./addons:/mnt/mb-addons
      # Third-party OCA modules, vendored by tools/vendor-oca.sh and not
      # committed. Read-only: they are upstream code, and an edit here would be
      # silently lost on the next re-vendor. The directory is created by the
      # Makefile so this mount does not fail on a clean checkout.
      - ./oca:/mnt/oca-addons:ro
    ports:
      - "${ODOO_PORT:-8169}:8069"
      # gevent/longpolling: the bus, live chat, and any notification pushed
      # rather than polled. Only used once workers > 0; see config/odoo.conf.
      - "${ODOO_GEVENT_PORT:-8175}:8072"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Catches every outbound mail so an invitation or invoice notification during
  # development cannot reach a real address. Opt in with `make mail`.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mb-odoo-mailpit
    profiles: ["tools"]
    ports:
      - "${MAILPIT_UI_PORT:-8125}:8025"
      - "${MAILPIT_SMTP_PORT:-1125}:1025"
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
