[options]
; -----------------------------------------------------------------------------
; Local development configuration.
;
; This stack is not published. It binds container-local ports that Compose maps
; to the host and nothing dials out to an edge, so the settings below trade
; hardening for convenience on purpose. Do not copy this file toward anything
; public without revisiting list_db, dbfilter, and proxy_mode.
; -----------------------------------------------------------------------------

; Guards database create/drop/backup at /web/database/manager. Local-only value:
; the manager is reachable here because list_db is True below.
admin_passwd = mb-local

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; True so /web/database/manager works and a scratch database can be created from
; the browser. Acceptable only because nothing outside this host can reach it.
list_db = True

; Left unset deliberately. With list_db on and several databases present, the
; manager lets you choose; pinning a filter here would hide the scratch
; databases the test targets create.
; dbfilter =

; /mnt/mb-addons is this repository's addons/, mounted by Compose. It
; comes first so a module developed here always wins over a same-named module
; from anywhere else.
;
; /mnt/oca-addons/* are OCA repositories vendored by tools/vendor-oca.sh, one
; path entry per repository because OCA keeps its modules at the repository
; root. No addon in this repository depends on OCA — mb_depot documents the one
; module it recommends and degrades without — so these paths may be empty and
; everything still installs.
addons_path = /mnt/mb-addons,/mnt/oca-addons/stock-logistics-workflow,/mnt/oca-addons/stock-logistics-warehouse,/mnt/oca-addons/stock-logistics-reporting,/mnt/oca-addons/sale-workflow,/usr/lib/python3/dist-packages/odoo/addons

data_dir = /var/lib/odoo

; Zero keeps everything in one process, which is what makes a breakpoint usable
; and keeps the websocket bus on the HTTP port instead of moving it to 8072.
; Raise it to test real concurrency, and expect the bus to move with it.
workers = 0
max_cron_threads = 1

; Must be all interfaces to be reachable through the Compose port mapping;
; Odoo 20 will default this to 127.0.0.1, so it is set explicitly rather than
; inherited.
http_interface = 0.0.0.0
http_port = 8069

; False because nothing terminates TLS in front of this stack. Turning it on
; without a proxy that sets X-Forwarded-* lets a client spoof its own scheme
; and host, and Odoo will build password-reset links from what it is told.
proxy_mode = False

log_level = info
logfile = None
